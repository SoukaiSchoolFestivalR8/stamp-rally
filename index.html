<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタンプラリー</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
    #reader { width: 100%; max-width: 400px; margin: 10px auto; border: 2px dashed #ccc; }
    .stamp-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
    .stamp-box { width: 90px; height: 90px; border: 2px solid #333; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; background-color: #f0f0f0; }
    .stamp-box.acquired { background-color: #ffe0b2; border-color: #ff9800; color: #e65100; position: relative; }
    .stamp-box.acquired::after { content: "済"; position: absolute; font-size: 40px; color: #d32f2f; font-weight: bold; opacity: 0.8; transform: rotate(-15deg); }
    button { padding: 12px 24px; font-size: 16px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; }
  </style>
</head>
<body>

  <h2>文化祭スタンプラリー</h2>
  
  <button id="start-scan-btn" onclick="startScanner()">📷 カメラでQRを読み込む</button>
  <div id="reader" style="display:none;"></div>

  <h3>獲得状況</h3>
  <div class="stamp-grid">
    <div id="stamp-booth1" class="stamp-box">ブース 1</div>
    <div id="stamp-booth2" class="stamp-box">ブース 2</div>
    <div id="stamp-booth3" class="stamp-box">ブース 3</div>
  </div>

  <script>
    const STAMPS = ["booth1", "booth2", "booth3"];
    let html5QrcodeScanner = null;

    window.onload = function() {
      updateUI();
    };

    function startScanner() {
      document.getElementById('reader').style.display = 'block';
      document.getElementById('start-scan-btn').style.display = 'none';

      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanError
      ).catch(err => {
        alert("カメラの起動に失敗しました。カメラ権限を許可してください。");
        stopScanner();
      });
    }

    function onScanSuccess(decodedText) {
      if (STAMPS.includes(decodedText)) {
        localStorage.setItem("stamp_" + decodedText, "true");
        alert("スタンプを獲得しました！: " + decodedText);
        updateUI();
        stopScanner();
      } else {
        alert("無効なQRコードです");
      }
    }

    function onScanError(errorMessage) {}

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('reader').style.display = 'none';
          document.getElementById('start-scan-btn').style.display = 'inline-block';
        }).catch(err => console.error(err));
      }
    }

    function updateUI() {
      STAMPS.forEach(boothId => {
        const isAcquired = localStorage.getItem("stamp_" + boothId) === "true";
        const element = document.getElementById("stamp-" + boothId);
        if (element) {
          if (isAcquired) {
            element.classList.add("acquired");
          } else {
            element.classList.remove("acquired");
          }
        }
      });
    }
  </script>
</body>
</html>
