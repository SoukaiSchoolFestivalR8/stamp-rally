<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>令和8年度文化祭</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 10px; margin: 0; background-color: #f8f9fa; }
    
    /* ① メインタブ（左：校内マップ / 右：スタンプラリー） */
    .tab-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; max-width: 180px; padding: 12px; font-size: 16px; font-weight: bold; border: 2px solid #007bff; background-color: white; color: #007bff; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background-color: #007bff; color: white; }

    /* サブタブ（マップ切替用） */
    .sub-tab-menu { display: flex; justify-content: center; gap: 5px; margin-bottom: 15px; }
    .sub-tab-btn { padding: 8px 14px; font-size: 14px; border: 1px solid #6c757d; background-color: white; color: #333; border-radius: 20px; cursor: pointer; }
    .sub-tab-btn.active { background-color: #6c757d; color: white; font-weight: bold; }

    .page-content, .map-section { display: none; }
    .page-content.active, .map-section.active { display: block; }

    /* ② マップ表示エリア */
    .map-container { position: relative; max-width: 400px; margin: 0 auto; border: 2px solid #ddd; border-radius: 12px; overflow: hidden; background-color: #ffffff; }
    .map-image { width: 100%; display: block; }

    /* Googleマップ風ピンデザイン (未訪問:赤 / 訪問済:緑) */
   /* ピンのサイズ調整 */
.map-pin {
  position: absolute;
  width: 24px;  /* ここを小さくする（例: 32px → 24px） */
  height: 24px; /* ここを小さくする（例: 32px → 24px） */
  transform: translate(-50%, -100%);
  cursor: pointer;
  z-index: 10;
}

/* ピンの中のSVGも自動でリサイズされるように指定 */
.map-pin svg {
  width: 100%;
  height: 100%;
  display: block;
}
    
    /* ピンの色指定 */
    .map-pin path { fill: #dc3545; } /* 未訪問: 赤 */
    .map-pin.acquired path { fill: #28a745; } /* 訪問済: 緑 */

    /* ピンの座標設定（※実際の画像に合わせて % を調整してください） */
    /* 東館（6個: ピン1〜ピン6） */
    #pin-east-1 { top: 21%; left: 49%; } /* 中2 */
    #pin-east-2 { top: 21%; left: 62%; } /* 中3 */
    #pin-east-3 { top: 30%; left: 45%; } /* 自衛隊（雨天時・booth16連動） */
    #pin-east-4 { top: 52%; left: 43.5%; } /* 中1 */
    #pin-east-5 { top: 55%; left: 75%; } /* 高2-3 */
    #pin-east-6 { top: 78%; left: 38%; } /* 茶華道・写真・美術・書道部 */

    /* 西館（5個: ピン7〜ピン11） */
    #pin-west-7 { top: 25%; left: 35%; }  /* 高2-2 */
    #pin-west-8 { top: 40%; left: 70%; }  /* 高1-2 */
    #pin-west-9 { top: 55%; left: 30%; }  /* 高2-1 */
    #pin-west-10 { top: 70%; left: 65%; } /* 高1-1 */
    #pin-west-11 { top: 85%; left: 45%; } /* ボート部 */

    /* 飲食エリア（5個: ピン12〜ピン16） */
    #pin-food-12 { top: 20%; left: 20%; } /* 高1-3 */
    #pin-food-13 { top: 35%; left: 70%; } /* 高3-2 */
    #pin-food-14 { top: 50%; left: 30%; } /* 高3-1 */
    #pin-food-15 { top: 65%; left: 75%; } /* 家庭部 */
    #pin-food-16 { top: 85%; left: 50%; } /* 自衛隊（晴天時・booth16連動） */

    /* スタンプカード表示 (エリア別レイアウト) */
    .stamp-group { margin-bottom: 20px; }
    .stamp-group-title { font-size: 16px; font-weight: bold; color: #495057; text-align: left; max-width: 350px; margin: 0 auto 8px auto; border-bottom: 2px solid #dee2e6; padding-bottom: 4px; }
    .stamp-grid { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; max-width: 360px; margin: 0 auto; }
    .stamp-box { width: 62px; height: 62px; border: 2px solid #6c757d; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; background-color: #ffffff; font-size: 12px; box-sizing: border-box; padding: 4px; text-align: center; }
    .stamp-box.acquired { background-color: #d4edda; border-color: #28a745; color: #155724; position: relative; }
    .stamp-box.acquired::after { content: "済"; position: absolute; font-size: 28px; color: #28a745; font-weight: bold; opacity: 0.8; }
    
    #reader { width: 100%; max-width: 400px; margin: 10px auto; border: 2px dashed #ccc; }
    .scan-btn { padding: 14px 28px; font-size: 18px; border-radius: 8px; border: none; background: #28a745; color: white; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
  </style>
</head>

  <script>
    // 全16個のスタンプIDキー
    const STAMPS = Array.from({length: 16}, (_, i) => `booth${i + 1}`);
    let html5QrcodeScanner = null;

    window.onload = function() {
      updateUI();
    };

    // メインタブ切り替え
    function switchMainTab(tabName) {
      stopScanner();
      document.getElementById('btn-map').classList.remove('active');
      document.getElementById('btn-stamp').classList.remove('active');
      document.getElementById('page-map').classList.remove('active');
      document.getElementById('page-stamp').classList.remove('active');

      if (tabName === 'map') {
        document.getElementById('btn-map').classList.add('active');
        document.getElementById('page-map').classList.add('active');
      } else {
        document.getElementById('btn-stamp').classList.add('active');
        document.getElementById('page-stamp').classList.add('active');
      }
    }

    // マップサブタブ切り替え
    function switchMap(mapName) {
      document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.map-section').forEach(sec => sec.classList.remove('active'));

      document.getElementById(`btn-sub-${mapName}`).classList.add('active');
      document.getElementById(`map-${mapName}`).classList.add('active');
    }

    // Googleサイトへジャンプ（マップピンから利用）
    function openLink(url) {
      if (url && url !== '#') {
        window.open(url, '_blank');
      }
    }

    // カメラ起動処理
    function startScanner() {
      document.getElementById('reader').style.display = 'block';
      document.getElementById('start-scan-btn').style.display = 'none';

      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanError
      ).catch(err => {
        alert("カメラの起動に失敗しました。カメラ権限を許可してください。");
        stopScanner();
      });
    }

    function onScanSuccess(decodedText) {
      if (STAMPS.includes(decodedText)) {
        localStorage.setItem("stamp_" + decodedText, "true");
        alert("スタンプを獲得しました！: " + decodedText);
        updateUI();
        stopScanner();
      } else {
        alert("無効なQRコードです");
      }
    }

    function onScanError(errorMessage) {}

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('reader').style.display = 'none';
          document.getElementById('start-scan-btn').style.display = 'inline-block';
        }).catch(err => console.error(err));
      }
    }

    // UIおよびピン（未訪問:赤 / 訪問済:緑）の表示更新
    function updateUI() {
      STAMPS.forEach(boothId => {
        const isAcquired = localStorage.getItem("stamp_" + boothId) === "true";
        
        // スタンプ枠
        const stampElement = document.getElementById("stamp-" + boothId);
        if (stampElement) {
          if (isAcquired) stampElement.classList.add("acquired");
          else stampElement.classList.remove("acquired");
        }

        // マップのピン（紐付けられたすべてのピンを赤/緑切り替え）
        const pins = document.querySelectorAll(`.map-pin[data-stamp="${boothId}"]`);
        pins.forEach(pin => {
          if (isAcquired) pin.classList.add("acquired");
          else pin.classList.remove("acquired");
        });
      });
    }
  </script>
</body>
</html>
